name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test email.test.mjs gmail.test.mjs
      - run: node --experimental-default-type=module --check worker.js
      - run: node --experimental-default-type=module --check email.js
      - run: node --experimental-default-type=module --check gmail.js
      - run: node --check email-ui.js
